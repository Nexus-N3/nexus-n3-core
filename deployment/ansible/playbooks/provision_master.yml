---
- name: Provision nexus-n3-core master hosts
  hosts: "{{ nexus_provision_hosts | default('master') }}"
  become: true
  pre_tasks:
    - name: Require Linux hosts for host provisioning
      ansible.builtin.assert:
        that:
          - ansible_system == "Linux"
        fail_msg: >-
          Host provisioning is supported only on Linux targets.
          Use the release deployment playbooks for software rollout, and keep
          Windows hosts as development environments only.
  roles:
    - role: nexus_dependencies
      tags:
        - nexus_dependencies
    - role: nexus_kiosk
      tags:
        - nexus_kiosk
    - role: nexus_usb_hotplug
      tags:
        - nexus_usb_hotplug
    - role: nexus_access_point
      tags: 
        - nexus_access_point
    - role: nexus_smb_share
      tags:
        - nexus_smb_share