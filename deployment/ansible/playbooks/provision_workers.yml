---
- name: Provision nexus-n3-core worker hosts
  hosts: "{{ nexus_provision_hosts | default('workers') }}"
  become: true
  pre_tasks:
    - name: Require Linux hosts for host provisioning
      ansible.builtin.assert:
        that:
          - ansible_system == "Linux"
        fail_msg: >-
          Host provisioning is supported only on Linux targets.
          Use the release deployment playbooks for software rollout, and keep
          Windows hosts as development environments only.
  roles:
    - nexus_dependencies
    - nexus_worker_smb
