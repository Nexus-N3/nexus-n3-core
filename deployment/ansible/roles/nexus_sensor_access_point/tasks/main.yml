---
- name: Ensure sensor AP packages are installed
  ansible.builtin.apt:
    name:
      - iw
      - ethtool
      - network-manager
      - sudo
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Find Wi-Fi interface using the expected USB driver
  ansible.builtin.shell: |
    for interface_path in /sys/class/net/*; do
      interface_name="${interface_path##*/}"

      driver_path="$(readlink -f "${interface_path}/device/driver" 2>/dev/null || true)"
      driver_name="${driver_path##*/}"

      if [ "${driver_name}" = "{{ nexus_sensor_ap_driver }}" ]; then
        printf '%s\n' "${interface_name}"
        exit 0
      fi
    done

    exit 1
  args:
    executable: /bin/bash
  register: nexus_sensor_ap_detected_interface
  changed_when: false
  failed_when: false
  when: nexus_sensor_ap_interface | length == 0

- name: Resolve sensor AP interface
  ansible.builtin.set_fact:
    nexus_sensor_ap_resolved_interface: >-
      {{
        nexus_sensor_ap_interface
        if nexus_sensor_ap_interface | length > 0
        else nexus_sensor_ap_detected_interface.stdout | trim
      }}

- name: Require the USB Wi-Fi adapter
  ansible.builtin.assert:
    that:
      - nexus_sensor_ap_resolved_interface | length > 0
      - nexus_sensor_ap_resolved_interface != "wlan0"
      - nexus_sensor_ap_passphrase | length >= 8
    fail_msg: >-
      A supported USB Wi-Fi adapter and an 8+ character sensor AP passphrase
      are required. Connect the adapter or set the AP variables explicitly.

- name: Check sensor Wi-Fi driver
  ansible.builtin.command:
    argv:
      - ethtool
      - -i
      - "{{ nexus_sensor_ap_resolved_interface }}"
  register: nexus_sensor_ap_driver_info
  changed_when: false

- name: Verify expected sensor Wi-Fi driver
  ansible.builtin.assert:
    that:
      - "'driver: ' ~ nexus_sensor_ap_driver in nexus_sensor_ap_driver_info.stdout"
    fail_msg: >-
      Interface {{ nexus_sensor_ap_resolved_interface }} is not using
      {{ nexus_sensor_ap_driver }}.

- name: Check sensor bridge interface
  ansible.builtin.command:
    argv:
      - ip
      - link
      - show
      - dev
      - "{{ nexus_sensor_bridge_interface }}"
  register: nexus_sensor_ap_bridge_link
  changed_when: false
  failed_when: false

- name: Require sensor bridge interface
  ansible.builtin.assert:
    that:
      - nexus_sensor_ap_bridge_link.rc == 0
    fail_msg: >-
      Sensor bridge {{ nexus_sensor_bridge_interface }} does not exist.
      Run the nexus_sensor_network role before nexus_sensor_access_point.

- name: Install Wi-Fi regulatory-domain service
  ansible.builtin.template:
    src: wifi-regdom.service.j2
    dest: /etc/systemd/system/nexus-wifi-regdom.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Flush handlers before starting regulatory-domain service
  ansible.builtin.meta: flush_handlers

- name: Enable Wi-Fi regulatory-domain service
  ansible.builtin.systemd:
    name: nexus-wifi-regdom.service
    enabled: true
    state: started

- name: Apply wireless regulatory domain now
  ansible.builtin.command:
    argv:
      - iw
      - reg
      - set
      - "{{ nexus_sensor_ap_country_code }}"
  changed_when: false

- name: Install fixed-purpose sensor Wi-Fi recovery service
  ansible.builtin.template:
    src: nexus-n3-wifi-recovery.service.j2
    dest: /etc/systemd/system/nexus-n3-wifi-recovery.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Install sensor Wi-Fi recovery sudoers rule
  ansible.builtin.template:
    src: nexus-n3-wifi-recovery.sudoers.j2
    dest: /etc/sudoers.d/nexus-n3-wifi-recovery
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s

- name: Remove superseded sensor Wi-Fi recovery PolicyKit rule
  ansible.builtin.file:
    path: /etc/polkit-1/rules.d/49-nexus-n3-wifi-recovery.rules
    state: absent

- name: Install sensor Wi-Fi NetworkManager PolicyKit rule
  ansible.builtin.template:
    src: nexus-n3-wifi-networkmanager.rules.j2
    dest: /etc/polkit-1/rules.d/49-nexus-n3-wifi-networkmanager.rules
    owner: root
    group: root
    mode: "0644"

- name: Flush handlers before sensor Wi-Fi recovery can be used
  ansible.builtin.meta: flush_handlers

- name: Check whether sensor AP connection exists
  ansible.builtin.command:
    argv:
      - nmcli
      - -g
      - connection.id
      - connection
      - show
      - "{{ nexus_sensor_ap_connection_name }}"
  register: nexus_sensor_ap_connection_exists
  changed_when: false
  failed_when: false

- name: Create sensor AP connection
  ansible.builtin.command:
    argv:
      - nmcli
      - connection
      - add
      - type
      - wifi
      - ifname
      - "{{ nexus_sensor_ap_resolved_interface }}"
      - con-name
      - "{{ nexus_sensor_ap_connection_name }}"
      - ssid
      - "{{ nexus_sensor_ap_ssid }}"
  when: nexus_sensor_ap_connection_exists.rc != 0

# NetworkManager 1.36 requires Layer-3 settings to be removed before an
# existing routed/shared Wi-Fi profile is converted to a bridge port. This is
# also the migration path from the legacy ipv4.method=shared sensor AP.
- name: Read current sensor AP bridge-port state
  ansible.builtin.command:
    argv:
      - nmcli
      - -g
      - connection.slave-type
      - connection
      - show
      - "{{ nexus_sensor_ap_connection_name }}"
  register: nexus_sensor_ap_slave_type
  changed_when: false

- name: Deactivate sensor AP before bridge-port migration
  ansible.builtin.command:
    argv:
      - nmcli
      - connection
      - down
      - "{{ nexus_sensor_ap_connection_name }}"
  register: nexus_sensor_ap_down
  changed_when: nexus_sensor_ap_down.rc == 0
  failed_when: false
  when: nexus_sensor_ap_slave_type.stdout | trim != 'bridge'

- name: Remove IPv4 settings before sensor AP bridge-port migration
  ansible.builtin.command:
    argv:
      - nmcli
      - connection
      - modify
      - "{{ nexus_sensor_ap_connection_name }}"
      - remove
      - ipv4
  when: nexus_sensor_ap_slave_type.stdout | trim != 'bridge'

- name: Remove IPv6 settings before sensor AP bridge-port migration
  ansible.builtin.command:
    argv:
      - nmcli
      - connection
      - modify
      - "{{ nexus_sensor_ap_connection_name }}"
      - remove
      - ipv6
  when: nexus_sensor_ap_slave_type.stdout | trim != 'bridge'

- name: Configure sensor AP radio and bridge membership
  ansible.builtin.command:
    argv:
      - nmcli
      - connection
      - modify
      - "{{ nexus_sensor_ap_connection_name }}"
      - connection.interface-name
      - "{{ nexus_sensor_ap_resolved_interface }}"
      - connection.autoconnect
      - "{{ 'yes' if nexus_sensor_ap_autoconnect | bool else 'no' }}"
      - connection.master
      - "{{ nexus_sensor_bridge_interface }}"
      - connection.slave-type
      - bridge
      - 802-11-wireless.mode
      - ap
      - 802-11-wireless.band
      - "{{ nexus_sensor_ap_band }}"
      - 802-11-wireless.channel
      - "{{ nexus_sensor_ap_channel | string }}"
      - 802-11-wireless.cloned-mac-address
      - permanent
      - 802-11-wireless.ap-isolation
      - "{{ 1 if nexus_sensor_ap_isolation | bool else 0 }}"
  changed_when: false

- name: Configure sensor AP security
  ansible.builtin.command:
    argv:
      - nmcli
      - connection
      - modify
      - "{{ nexus_sensor_ap_connection_name }}"
      - 802-11-wireless-security.key-mgmt
      - wpa-psk
      - 802-11-wireless-security.proto
      - rsn
      - 802-11-wireless-security.pmf
      - disable
      - 802-11-wireless-security.psk
      - "{{ nexus_sensor_ap_passphrase }}"
  no_log: true
  changed_when: false

- name: Activate sensor AP
  ansible.builtin.command:
    argv:
      - nmcli
      - connection
      - up
      - "{{ nexus_sensor_ap_connection_name }}"
      - ifname
      - "{{ nexus_sensor_ap_resolved_interface }}"
  changed_when: false

- name: Read active sensor AP bridge membership
  ansible.builtin.command:
    argv:
      - bridge
      - link
      - show
      - dev
      - "{{ nexus_sensor_ap_resolved_interface }}"
  register: nexus_sensor_ap_bridge_membership
  changed_when: false

- name: Verify active sensor AP is forwarding through sensor bridge
  ansible.builtin.assert:
    that:
      - "('master ' ~ nexus_sensor_bridge_interface) in nexus_sensor_ap_bridge_membership.stdout"
      - "'state forwarding' in nexus_sensor_ap_bridge_membership.stdout"
    fail_msg: >-
      {{ nexus_sensor_ap_resolved_interface }} is not forwarding as a port of
      {{ nexus_sensor_bridge_interface }}.

- name: Read active sensor AP details
  ansible.builtin.command:
    argv:
      - iw
      - dev
      - "{{ nexus_sensor_ap_resolved_interface }}"
      - info
  register: nexus_sensor_ap_info
  changed_when: false

- name: Show active sensor AP
  ansible.builtin.debug:
    var: nexus_sensor_ap_info.stdout_lines
