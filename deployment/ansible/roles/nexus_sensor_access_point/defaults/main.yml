---
# Used by provision_master.yml to decide whether to include the role.
# The role itself does not check this variable.
nexus_sensor_ap_enabled: false

# Leave empty to automatically find the interface using the mt76x2u driver.
# It can also be explicitly set to something such as wlx00c0cabaa751.
nexus_sensor_ap_interface: ""
nexus_sensor_ap_driver: mt76x2u

nexus_sensor_ap_connection_name: nexus-n3-sensor-ap
nexus_sensor_ap_ssid: nexus-n3-sensors

# Do not put the real password in defaults.
nexus_sensor_ap_passphrase: ""

nexus_sensor_ap_country_code: EE
nexus_sensor_ap_band: a
nexus_sensor_ap_channel: 36
nexus_sensor_ap_isolation: true

# Separate subnet from nexus-n3-edge-access.
nexus_sensor_ap_address: 192.168.60.1/24
nexus_sensor_ap_dhcp_range_start: 192.168.60.10
nexus_sensor_ap_dhcp_range_end: 192.168.60.100
nexus_sensor_ap_dhcp_netmask: 255.255.255.0
nexus_sensor_ap_dhcp_lease: 12h