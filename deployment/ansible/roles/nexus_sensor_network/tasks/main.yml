---
- name: Validate sensor network configuration
  ansible.builtin.assert:
    that:
      - nexus_role in ['standalone', 'master', 'worker']
      - nexus_sensor_bridge_interface | length > 0
      - nexus_sensor_bridge_connection_name | length > 0
      - nexus_sensor_network_address | length > 0
      - nexus_sensor_network_ipv6_method in ['disabled', 'ignore', 'auto']
      - nexus_sensor_vlan_id | int >= 1
      - nexus_sensor_vlan_id | int <= 4094
      - nexus_sensor_vlan_parent_interface | length > 0
      - nexus_sensor_vlan_interface | length > 0
    fail_msg: >-
      The sensor network is only valid on standalone/master/worker nodes and
      requires a bridge interface, bridge connection name, and node CIDR.

- name: Ensure sensor network packages are installed
  ansible.builtin.apt:
    name:
      - network-manager
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Disable dnsmasq DNS service
  ansible.builtin.lineinfile:
    path: /etc/dnsmasq.conf
    regexp: '^#?port='
    line: 'port=0'
    state: present
  when: nexus_sensor_dhcp_enabled | bool
  notify: Reload sensor dnsmasq if running

- name: Ensure sensor DHCP package is installed on DHCP owner
  ansible.builtin.apt:
    name:
      - dnsmasq
    state: present
    update_cache: true
    cache_valid_time: 3600
    policy_rc_d: 101
  when: nexus_sensor_dhcp_enabled | bool

- name: Check sensor VLAN parent interface
  ansible.builtin.command:
    argv:
      - ip
      - link
      - show
      - dev
      - "{{ nexus_sensor_vlan_parent_interface }}"
  register: nexus_sensor_network_parent_link
  changed_when: false
  failed_when: false

- name: Require sensor VLAN parent interface
  ansible.builtin.assert:
    that:
      - nexus_sensor_network_parent_link.rc == 0
    fail_msg: >-
      Sensor VLAN parent interface {{ nexus_sensor_vlan_parent_interface }}
      does not exist.

- name: Install Nexus N3 sensor network Netplan configuration
  ansible.builtin.template:
    src: sensor-network.yaml.j2
    dest: /etc/netplan/80-nexus-n3-sensor-network.yaml
    owner: root
    group: root
    mode: "0600"
  register: nexus_sensor_network_netplan

- name: Find legacy NetworkManager-generated sensor Netplan files
  ansible.builtin.find:
    paths: /etc/netplan
    patterns:
      - "90-NM-*.yaml"
    file_type: file
    contains: 'name: "(nexus-n3-sensor-bridge|nexus-n3-sensor-vlan)"'
    read_whole_file: true
  register: nexus_sensor_network_legacy_netplan

- name: Remove legacy NetworkManager-generated sensor Netplan files
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ nexus_sensor_network_legacy_netplan.files }}"
  loop_control:
    label: "{{ item.path }}"

- name: Validate generated Netplan configuration
  ansible.builtin.command:
    argv:
      - netplan
      - generate
  changed_when: false

- name: Check ufw status for sensor network
  ansible.builtin.command:
    argv:
      - ufw
      - status
  register: nexus_sensor_network_ufw_status
  changed_when: false

- name: Allow x-IMU3 announcements through sensor bridge
  ansible.builtin.command:
    argv:
      - ufw
      - allow
      - in
      - on
      - "{{ nexus_sensor_bridge_interface }}"
      - proto
      - udp
      - to
      - any
      - port
      - "10000"
      - comment
      - "Nexus N3 x-IMU3 announcements"
  register: nexus_sensor_network_ufw_allow_ximu3
  changed_when: "'Skipping' not in nexus_sensor_network_ufw_allow_ximu3.stdout"
  when: "'Status: active' in nexus_sensor_network_ufw_status.stdout"

- name: Install sensor-network DHCP configuration
  ansible.builtin.template:
    src: dnsmasq.conf.j2
    dest: "{{ nexus_sensor_dhcp_config_path }}"
    owner: root
    group: root
    mode: "0644"
  when: nexus_sensor_dhcp_enabled | bool
  notify: Reload sensor dnsmasq if running

- name: Remove sensor-network DHCP configuration from non-DHCP nodes
  ansible.builtin.file:
    path: "{{ nexus_sensor_dhcp_config_path }}"
    state: absent
  when: not (nexus_sensor_dhcp_enabled | bool)
  notify: Reload sensor dnsmasq if running

- name: Validate dnsmasq configuration on DHCP owner
  ansible.builtin.command:
    argv:
      - dnsmasq
      - --test
  changed_when: false
  when: nexus_sensor_dhcp_enabled | bool

- name: Ensure dnsmasq is enabled on sensor DHCP owner
  ansible.builtin.service:
    name: dnsmasq
    enabled: true
    state: started
  when: nexus_sensor_dhcp_enabled | bool

- name: Flush sensor DHCP configuration handlers
  ansible.builtin.meta: flush_handlers

- name: Read active sensor bridge details
  ansible.builtin.command:
    argv:
      - ip
      - -details
      - address
      - show
      - dev
      - "{{ nexus_sensor_bridge_interface }}"
  register: nexus_sensor_bridge_details
  changed_when: false

- name: Show active sensor bridge
  ansible.builtin.debug:
    var: nexus_sensor_bridge_details.stdout_lines
