nexus_dependencies_packages_common:
  - python3
  - python3-venv
  - python3-dev
  - python3-pip
  - python3-six
  - python3-dbus
  - avahi-daemon
  - avahi-utils
  - nfs-common
  - nfs-kernel-server
  - dnsmasq
  - wireguard

nexus_dependencies_exfat_packages: "{{ ['exfat-fuse', 'exfat-utils'] if ansible_distribution == 'Ubuntu' and (ansible_distribution_major_version | int) < 22 else ['exfatprogs'] }}"

nexus_dependencies_packages: "{{ nexus_dependencies_packages_common + nexus_dependencies_exfat_packages }}"
