---
- name: Validate control network configuration
  ansible.builtin.assert:
    that:
      - nexus_control_network_interface | length > 0
      - nexus_control_network_address is defined
      - nexus_control_network_address | length > 0
      - nexus_control_network_address is match('^(?:[0-9]{1,3}\.){3}[0-9]{1,3}/(?:[0-9]|[12][0-9]|3[0-2])$')
    fail_msg: >-
      Set nexus_control_network_address to this node's static IPv4 CIDR
      (for example, 192.168.60.1/24).

- name: Check native control network interface
  ansible.builtin.command:
    argv:
      - ip
      - link
      - show
      - dev
      - "{{ nexus_control_network_interface }}"
  register: nexus_control_network_link
  changed_when: false
  failed_when: false

- name: Require native control network interface
  ansible.builtin.assert:
    that:
      - nexus_control_network_link.rc == 0
    fail_msg: >-
      Control network interface {{ nexus_control_network_interface }} does not exist.

- name: Install Nexus N3 control network Netplan configuration
  ansible.builtin.template:
    src: control-network.yaml.j2
    dest: /etc/netplan/70-nexus-n3-control-network.yaml
    owner: root
    group: root
    mode: "0600"
  notify: Apply control network Netplan configuration

- name: Validate generated Netplan configuration
  ansible.builtin.command:
    argv:
      - netplan
      - generate
  changed_when: false

