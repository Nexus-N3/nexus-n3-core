- name: Reset AP configuration (manual cleanup)
  ansible.builtin.include_tasks: reset.yml
  tags: reset_ap

- name: Ensure AP runtime packages are installed
  ansible.builtin.apt:
    name:
      - dnsmasq
      - avahi-daemon
      - avahi-utils
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Set wireless regulatory domain
  ansible.builtin.command:
    argv:
      - iw
      - reg
      - set
      - "{{ nexus_ap_country_code }}"
  changed_when: false

- name: Check whether AP connection exists
  ansible.builtin.command:
    argv:
      - nmcli
      - -g
      - NAME
      - connection
      - show
      - "{{ nexus_ap_connection_name }}"
  register: nexus_ap_connection_exists
  changed_when: false
  failed_when: false

- name: Create AP connection
  ansible.builtin.command:
    argv:
      - nmcli
      - connection
      - add
      - type
      - wifi
      - ifname
      - "{{ nexus_ap_interface }}"
      - con-name
      - "{{ nexus_ap_connection_name }}"
      - ssid
      - "{{ nexus_ap_ssid }}"
      - 802-11-wireless.mode
      - ap
  when: nexus_ap_connection_exists.rc != 0

- name: Configure AP connection radio settings
  ansible.builtin.command:
    argv:
      - nmcli
      - connection
      - modify
      - "{{ nexus_ap_connection_name }}"
      - connection.autoconnect
      - "yes"
      - 802-11-wireless.band
      - "{{ nexus_ap_band }}"
      - 802-11-wireless.channel
      - "{{ nexus_ap_channel | string }}"
      - 802-11-wireless.ap-isolation
      - "{{ 1 if nexus_ap_isolation | bool else 0 }}"

- name: Configure AP connection security
  ansible.builtin.command:
    argv:
      - nmcli
      - connection
      - modify
      - "{{ nexus_ap_connection_name }}"
      - 802-11-wireless-security.key-mgmt
      - wpa-psk
      - 802-11-wireless-security.psk
      - "{{ nexus_ap_passphrase }}"

- name: Configure AP connection addressing
  ansible.builtin.command:
    argv:
      - nmcli
      - connection
      - modify
      - "{{ nexus_ap_connection_name }}"
      - ipv4.method
      - manual
      - ipv4.addresses
      - "{{ nexus_ap_address }}"
      - ipv4.never-default
      - "yes"
      - ipv6.method
      - disabled

- name: Configure dnsmasq for AP DHCP
  ansible.builtin.template:
    src: dnsmasq.conf.j2
    dest: /etc/dnsmasq.d/nexus-n3-ap.conf
    mode: "0644"
  notify: Restart dnsmasq

- name: Validate dnsmasq configuration
  ansible.builtin.command: dnsmasq --test
  changed_when: false

- name: Ensure dnsmasq is enabled
  ansible.builtin.service:
    name: dnsmasq
    enabled: true
    state: started

- name: Ensure avahi-daemon is enabled
  ansible.builtin.service:
    name: avahi-daemon
    enabled: true
    state: started

- name: Bring up AP connection
  ansible.builtin.command:
    argv:
      - nmcli
      - connection
      - up
      - "{{ nexus_ap_connection_name }}"
      - ifname
      - "{{ nexus_ap_interface }}"

- name: Check ufw status
  ansible.builtin.command: ufw status
  register: nexus_ap_ufw_status
  changed_when: false
  failed_when: false

- name: Allow DHCP (UDP 67) through ufw
  ansible.builtin.command: ufw allow 67/udp
  register: nexus_ap_ufw_allow_dhcp
  changed_when: "'Skipping' not in nexus_ap_ufw_allow_dhcp.stdout"
  when: "'Status: active' in nexus_ap_ufw_status.stdout"

- name: Allow admin UI (TCP) through ufw
  ansible.builtin.command: "ufw allow {{ nexus_admin_port | default(9000) }}/tcp"
  register: nexus_ap_ufw_allow_admin
  changed_when: "'Skipping' not in nexus_ap_ufw_allow_admin.stdout"
  when: "'Status: active' in nexus_ap_ufw_status.stdout"

- name: Persist disabled IP forwarding
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-nexus-n3-ap.conf
    content: "net.ipv4.ip_forward=0\n"
    owner: root
    group: root
    mode: "0644"

- name: Apply disabled IP forwarding
  ansible.builtin.command:
    argv:
      - sysctl
      - -w
      - net.ipv4.ip_forward=0
  changed_when: false
  when: nexus_ap_disable_ip_forwarding | bool
