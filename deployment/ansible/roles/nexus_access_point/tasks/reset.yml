- name: Remove AP NetworkManager connection
  ansible.builtin.command:
    argv:
      - nmcli
      - connection
      - delete
      - "{{ nexus_ap_connection_name }}"
  failed_when: false
  changed_when: true

- name: Remove AP configuration files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/dnsmasq.d/nexus-n3-ap.conf
    - /etc/NetworkManager/conf.d/99-nexusn3-ap.conf
    - /etc/systemd/system/nexusn3-ap-ip.service
  failed_when: false

- name: Reload systemd after reset
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restart NetworkManager after reset
  ansible.builtin.service:
    name: NetworkManager
    state: restarted
  failed_when: false
