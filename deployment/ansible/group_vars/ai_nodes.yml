nexus_dependencies_packages:
  - python3
  - python3-venv
  - python3-dev
  - python3-pip
  - python3-six
  - python3-dbus
  - avahi-daemon

nexus_role: ai
nexus_gateway: zeromq_gateway
nexus_admin_enabled: false
nexus_node_id: "{{ inventory_hostname }}"
nexus_compute_port: 7001
nexus_install_sensor_plugins: false
nexus_install_algorithm_plugins: true
